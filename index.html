<!DOCTYPE HTML>
<html>

<head>
	<title>Залізний Капут</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			font-family: Arial, sans-serif;
			background: #000;
			color: #eee;
			overflow: hidden;
		}

		#warningBanner {
			background: #ff4444;
			color: white;
			padding: 12px;
			text-align: center;
			font-weight: bold;
			position: fixed;
			top: 0;
			width: 100%;
			z-index: 2000;
		}

		#loginScreen {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.9);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		#mainContent {
			display: none;
			padding: 60px 20px 20px;
			max-width: 1200px;
			margin: 0 auto;
		}

		h3 {
			margin: 10px 0;
			text-align: center;
		}

		.tab {
			display: flex;
			margin-bottom: 1px;
			justify-content: space-between;
			flex-direction: row;
			align-items: center;
			margin: 0 auto;
			width: fit-content;
			gap: 20px;

		}

		.tab button {
			flex: 1;
			padding: 4px;
			background: #4247b7;
			color: white;
			border: none;
			cursor: pointer;
			font-size: 12px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex-direction: row;
		}

		.tab button.active {
			background: #5a5fff;
			border-bottom: 4px solid #ffff00;
		}

		.tabcontent {
			display: none;
		}

		.tabcontent.active {
			display: block;
		}

		.buttonContainer {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 12px;
			margin: 5px 0;
		}

		.motorSelectContainer,
		.motorControlContainer {
			display: flex;
			gap: 12px;
		}

		button {
			padding: 12px 24px;
			font-size: 12px;
			background: #4247b7;
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			min-width: 60px;
		}

		#motor1Btn.active,
		#motor2Btn.active,
		#motor3Btn.active,
		#motor4Btn.active {
			border: 1px solid #ffff00 !important;
			box-shadow: 0 0 15px #ffff00;
			background: #5a5fff;
		}

		button:hover {
			background: #ff494d;
		}

		button:active {
			background: #d32f2f;
		}

		#syncBtn,
		#sync2Btn {
			background: #0288d1;
			width: 170px !important;
			min-width: 170px !important;
			max-width: 170px !important;
			text-align: center;
			box-sizing: border-box;
			padding: 12px 20px;
		}

		#syncBtn.on,
		#sync2Btn.on {
			background: #4caf50;
		}

		#slider-container,
		#slider-container2 {
			margin: 2px 0;
			text-align: center;
		}

		#position-slider,
		#position-slider2 {
			width: 65%;
			height: 14px;
			background: linear-gradient(to right, #444 0%, #444 30%, #4247b7 30%, #4247b7 70%, #444 70%, #444 100%);
			border-radius: 10px;
			appearance: none;
			outline: none;
		}

		#position-slider::-webkit-slider-thumb,
		#position-slider2::-webkit-slider-thumb {
			width: 44px;
			height: 44px;
			background: #ff494d;
			border-radius: 50%;
			border: 4px solid white;
			cursor: pointer;
		}

		.motorAzimuthContainer {
			display: flex;
			justify-content: space-around;
			gap: 40px;
			margin-top: 2px;
		}

		.motor-pos {
			font-size: 14px;
			margin: 8px 0;
			text-align: center;
		}

		.STSInfoContainer {
			display: flex;
			flex-direction: row;
			justify-content: center;
			flex-wrap: wrap;
			gap: 15px;
			align-items: center;
			width: fit-content;
			margin: 0 auto;
		}

		.STSValue {
			max-width: 23%;
			height: 70px;
			font-size: 12px;
			text-align: center;
			margin: 2px 0;
			padding: 10px;
			background: #111;
			border-radius: 8px;
		}

		#map,
		#map2 {
			height: 320px;
			border: 2px solid #4247b7;
			border-radius: 10px;
			margin-top: 25px;
		}

		.azimuth-group {
			display: flex;
			flex-direction: row;
			align-items: center;
			gap: 6px;
			justify-content: center;
		}

		.azimuth-input {
			max-width: 60%;
			width: 230px;
			padding: 12px;
			font-size: 14px;
			border-radius: 8px;
			border: 1px solid #555;
			background: #222;
			color: white;
			transition: all 0.25s ease;
		}

		.azimuth-input.active {
			border: 2px solid #ffff00 !important;
			box-shadow: 0 0 15px #ffff00;
		}

		.azimuth-input::-webkit-outer-spin-button,
		.azimuth-input::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		input[type="text"],
		input[type="password"] {
			width: 300px;
			padding: 14px;
			margin: 12px;
			font-size: 17px;
			border-radius: 8px;
			border: 1px solid #555;
			background: #222;
			color: white;
		}

		#loginBtn {
			padding: 16px 50px;
			font-size: 20px;
			background: #28a745;
			border: none;
			border-radius: 8px;
			color: white;
			cursor: pointer;
		}

		#loginBtn:hover {
			background: #218838;
		}

		#loginError {
			color: #ff4444;
			margin-top: 15px;
			min-height: 24px;
			font-size: 16px;
		}

		#logoutBtn {
			position: absolute;
			top: 70px;
			right: 20px;
			padding: 10px 20px;
			background: #d32f2f;
			font-size: 16px;
		}

		#status1,
		#status2 {
			font-size: 18px;
			margin-left: 8px;
		}
	</style>
</head>

<body>

	<div id="warningBanner">⚠️ Знаходиться в розробці.</div>

	<div id="loginScreen">
		<h2>Авторизація</h2>
		<input type="text" id="username" placeholder="Ім'я користувача пристрою" autocomplete="off">
		<input type="password" id="password" placeholder="Пароль пристрою" autocomplete="off">
		<input type="text" id="mqttUser" placeholder="MQTT Username" autocomplete="off">
		<input type="password" id="mqttPass" placeholder="MQTT Password" autocomplete="off">
		<button id="loginBtn" onclick="tryLogin()">Увійти</button>
		<div id="loginError"></div>
	</div>

	<div id="mainContent">
		<h3>Залізний Капут</h3>

		<div class="tab">
			<button class="tablinks active" onclick="openSystem(event, 'System1')">Система 1 <span
					id="status1">🔴</span></button>
			<button class="tablinks" onclick="openSystem(event, 'System2')">Система 2 <span id="status2">🔴</span></button>
		</div>

		<!-- СИСТЕМА 1 -->
		<div id="System1" class="tabcontent active">
			<div class="STSInfoContainer">
				<div class="STSValue" id="STSValue-motor1">530-2750: Очікування даних сервоприводу...</div>
				<div class="STSValue" id="STSValue-motor2">2000-6000: Очікування даних сервоприводу...</div>
			</div>
			<div class="buttonContainer">
				<div class="motorSelectContainer">
					<button id="motor1Btn" onclick="switchMotor1(0)">530-2750</button>
					<button id="motor2Btn" onclick="switchMotor1(1)">2000-6000</button>
					<button id="syncBtn" onclick="toggleSync1()">Sync OFF</button>
				</div>
				<div class="motorControlContainer">
					<button id="setMiddleBtn1" onclick="setNewMiddle1()">Set New 0°</button>
					<button onclick="sendCommand1(3, activeMotor1)">Release</button>
					<button onclick="sendCommand1(4, activeMotor1)">Torque</button>
					<button onclick="sendCommand1(1, activeMotor1)">0°</button>
					<button onclick="sendCommand1(7, activeMotor1)">+</button>
					<button onclick="sendCommand1(8, activeMotor1)">-</button>
				</div>
			</div>
			<div id="slider-container">
				<input type="range" id="position-slider" min="0" max="4095" value="2047" step="any">
			</div>
			<div class="motorAzimuthContainer">
				<p class="motor-pos" id="current-pos-motor1">530-2750: 0°</p>
				<p class="motor-pos" id="current-pos-motor2">2000-6000: 0°</p>
			</div>
			<div
				style="margin:2px 0; text-align:center; display:flex; flex-direction:row; justify-content: space-around; align-items:center; flex-wrap: nowrap; gap:20px;">
				<div class="azimuth-group">
					<input type="number" id="degreeInput1" min="-70" max="70" step="0.1" placeholder="градуси"
						class="azimuth-input" data-motor="0">
				</div>
				<div class="azimuth-group">
					<input type="number" id="degreeInput2" min="-70" max="70" step="0.1" placeholder="градуси"
						class="azimuth-input" data-motor="1">
				</div>
			</div>
			<div id="map"></div>
		</div>

		<!-- СИСТЕМА 2 -->
		<div id="System2" class="tabcontent">
			<div class="STSInfoContainer">
				<div class="STSValue" id="STSValue-motor3">Лівий: Очікування даних сервоприводу...</div>
				<div class="STSValue" id="STSValue-motor4">Правий: Очікування даних сервоприводу...</div>
			</div>
			<div class="buttonContainer">
				<div class="motorSelectContainer">
					<button id="motor3Btn" onclick="switchMotor2(0)">530-2750</button>
					<button id="motor4Btn" onclick="switchMotor2(1)">2000-6000</button>
					<button id="sync2Btn" onclick="toggleSync2()">Sync OFF</button>
				</div>
				<div class="motorControlContainer">
					<button id="setMiddleBtn2" onclick="setNewMiddle2()">Set New 0°</button>
					<button onclick="sendCommand2(3, activeMotor2)">Release</button>
					<button onclick="sendCommand2(4, activeMotor2)">Torque</button>
					<button onclick="sendCommand2(1, activeMotor2)">0°</button>
					<button onclick="sendCommand2(7, activeMotor2)">+</button>
					<button onclick="sendCommand2(8, activeMotor2)">-</button>
				</div>
			</div>
			<div id="slider-container2">
				<input type="range" id="position-slider2" min="0" max="4095" value="2047" step="any">
			</div>
			<div class="motorAzimuthContainer">
				<p class="motor-pos" id="current-pos-motor3">530-2750: 0°</p>
				<p class="motor-pos" id="current-pos-motor4">2000-6000: 0°</p>
			</div>
			<div
				style="margin:2px 0; text-align:center; display:flex; flex-direction:row; justify-content: space-around; align-items:center; flex-wrap: wrap; gap:20px;">
				<div class="azimuth-group">
					<input type="number" id="degreeInput3" min="-77" max="77" step="0.1" placeholder="градуси"
						class="azimuth-input" data-motor="0">
				</div>
				<div class="azimuth-group">
					<input type="number" id="degreeInput4" min="-77" max="77" step="0.1" placeholder="градуси"
						class="azimuth-input" data-motor="1">
				</div>
			</div>
			<div id="map2"></div>
		</div>
		<button id="logoutBtn" onclick="logout()">Вийти</button>
	</div>

	<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script>
		// ====================== ГЛОБАЛЬНІ ЗМІННІ ======================
		let authToken1 = localStorage.getItem('servoAuthToken1') || ''
		let authToken2 = localStorage.getItem('servoAuthToken2') || ''
		let mqttConnected1 = false
		let mqttConnected2 = false
		let lastStatusTime1 = 0
		let lastStatusTime2 = 0
		const STATUS_TIMEOUT = 10000   // 10 секунд без статусу = офлайн

		let mqttClient1 = null
		let mqttClient2 = null

		const CLIENT_ID_BASE = 'web-client-' + Math.random().toString(16).substr(2, 8)
		const CLIENT_ID1 = CLIENT_ID_BASE + '-sys1'
		const CLIENT_ID2 = CLIENT_ID_BASE + '-sys2'

		// ====================== СИСТЕМА 1 ======================
		const BROKER1 = 'wss://940d7f06dbf1455c841afb26f9c5cf1c.s1.eu.hivemq.cloud:8884/mqtt'
		const BOARD1 = 1
		let degMotor1 = 0, degMotor2 = 0
		let activeMotor1 = 0
		let syncEnabled1 = false
		let pendingSync1 = false
		let lastSingleActiveMotor1 = 0
		let map1, marker1, arrowRed1, arrowBlue1, outlineYellow1_1, outlineYellow1_2

		// ====================== СИСТЕМА 2 ======================
		const BROKER2 = 'wss://c57fd02a32a645b5b10ab4e7833a2fa6.s1.eu.hivemq.cloud:8884/mqtt'
		const BOARD2 = 2
		let degMotor3 = 0, degMotor4 = 0
		let activeMotor2 = 0
		let syncEnabled2 = false
		let pendingSync2 = false
		let lastSingleActiveMotor2 = 0
		let map2, marker2, arrowRed2, arrowBlue2, outlineYellow2_1, outlineYellow2_2

		// ====================== ТАБИ ======================
		function openSystem(evt, systemName) {
			document.querySelectorAll('.tabcontent').forEach(el => el.classList.remove('active'))
			document.getElementById(systemName).classList.add('active')
			document.querySelectorAll('.tab button').forEach(b => b.classList.remove('active'))
			evt.currentTarget.classList.add('active')

			setTimeout(() => {
				if (systemName === 'System1' && map1) { map1.invalidateSize(); updateMap1() }
				if (systemName === 'System2' && map2) { map2.invalidateSize(); updateMap2() }
			}, 150)
		}

		function updateConnectionStatus() {
			const now = Date.now()
			const online1 = mqttConnected1 && (lastStatusTime1 > 0) && (now - lastStatusTime1 < STATUS_TIMEOUT)
			const online2 = mqttConnected2 && (lastStatusTime2 > 0) && (now - lastStatusTime2 < STATUS_TIMEOUT)

			document.getElementById('status1').innerHTML = online1 ? '🟢' : '🔴'
			document.getElementById('status2').innerHTML = online2 ? '🟢' : '🔴'
		}

		// ====================== MQTT ======================
		function connectMQTT1(mqttUser, mqttPass) {
			if (mqttClient1) mqttClient1.end()
			mqttClient1 = mqtt.connect(BROKER1, {
				clientId: CLIENT_ID1,
				username: mqttUser,
				password: mqttPass,
				clean: true,
				reconnectPeriod: 5000
			})

			mqttClient1.on('connect', () => {
				mqttConnected1 = true
				console.log('✅ MQTT1 connected')
				updateConnectionStatus()
				mqttClient1.subscribe('Werden/auth/response/' + CLIENT_ID1)
				mqttClient1.subscribe('Werden/status/1')

				const user = document.getElementById('username').value.trim()
				const pass = document.getElementById('password').value.trim()
				if (user && pass) {
					mqttClient1.publish('Werden/auth/request', JSON.stringify({ username: user, password: pass, clientId: CLIENT_ID1 }))
				}
			})

			mqttClient1.on('offline', () => { mqttConnected1 = false; updateConnectionStatus() })
			mqttClient1.on('error', () => { mqttConnected1 = false; updateConnectionStatus() })
			mqttClient1.on('message', (topic, message) => handleMessage1(topic, message.toString()))
		}

		function connectMQTT2(mqttUser, mqttPass) {
			if (mqttClient2) mqttClient2.end()
			mqttClient2 = mqtt.connect(BROKER2, {
				clientId: CLIENT_ID2,
				username: mqttUser,
				password: mqttPass,
				clean: true,
				reconnectPeriod: 5000,
				keepalive: 30,
				connectTimeout: 10000
			})

			mqttClient2.on('connect', () => {
				mqttConnected2 = true
				lastStatusTime2 = 0
				console.log('✅ MQTT2 connected')
				updateConnectionStatus()
				mqttClient2.subscribe('Werden/auth/response/' + CLIENT_ID2)
				mqttClient2.subscribe('Werden/status/2')

				const user = document.getElementById('username').value.trim()
				const pass = document.getElementById('password').value.trim()
				if (user && pass) {
					mqttClient2.publish('Werden/auth/request', JSON.stringify({ username: user, password: pass, clientId: CLIENT_ID2 }))
				}
			})

			mqttClient2.on('offline', () => {
				mqttConnected2 = false
				lastStatusTime2 = 0
				updateConnectionStatus()
			})
			mqttClient2.on('error', () => {
				mqttConnected2 = false
				lastStatusTime2 = 0
				updateConnectionStatus()
			})

			mqttClient2.on('close', () => {
				mqttConnected2 = false
				lastStatusTime2 = 0
				updateConnectionStatus()
			})
			mqttClient2.on('message', (topic, message) => handleMessage2(topic, message.toString()))
		}

		// ====================== ОБРОБКА ПОВІДОМЛЕНЬ ======================
		function handleMessage1(topic, payload) {
			console.log('📨 MQTT1 received:', topic, payload)
			if (topic === 'Werden/auth/response/' + CLIENT_ID1) {
				try {
					const data = JSON.parse(payload)
					if (data.status === 'success') {
						authToken1 = data.token
						localStorage.setItem('servoAuthToken1', authToken1)
						document.getElementById('loginError').innerHTML += '<br>✅ Система 1 авторизована'
						checkLoginComplete()
					}
				} catch (e) { console.error('Auth1 parse error', e) }
				return
			}

			if (topic === 'Werden/status/1') {
				try {
					const data = JSON.parse(payload)
					if (!data || !data.board || data.board !== BOARD1) {
						console.log(`🚫 MQTT1 отримав чужий статус (board=${data ? data.board : 'undefined'}), ігноруємо`)
						return
					}

					console.log('📡 Отримано статус від Board 1')
					lastStatusTime1 = Date.now()
					updateConnectionStatus()

					document.getElementById("position-slider").value = data.raw
					if (data.id == 1) {
						document.getElementById("STSValue-motor1").innerHTML = `Лівий | ID: ${data.id} | Raw: ${data.raw} | ${data.deg}° | Нап: ${data.volt || '?'}V | Нав: ${data.load || '?'}% | Швид: ${data.speed || '?'} | Темп: ${data.temp || '?'}°C | Вст.швид: ${data.set_speed || '?'}`
						document.getElementById("current-pos-motor1").textContent = `530-2750: ${data.deg}°`
						degMotor1 = data.deg
					} else if (data.id == 2) {
						document.getElementById("STSValue-motor2").innerHTML = `Правий | ID: ${data.id} | Raw: ${data.raw} | ${data.deg}° | Нап: ${data.volt || '?'}V | Нав: ${data.load || '?'}% | Швид: ${data.speed || '?'} | Темп: ${data.temp || '?'}°C | Вст.швид: ${data.set_speed || '?'}`
						document.getElementById("current-pos-motor2").textContent = `2000-6000: ${data.deg}°`
						degMotor2 = data.deg
					}
					if (data.sync !== undefined && !pendingSync1) {
						const newSync = data.sync === true
						if (newSync !== syncEnabled1) {
							syncEnabled1 = newSync
							const btn = document.getElementById('syncBtn')
							btn.textContent = syncEnabled1 ? "Sync ON" : "Sync OFF"
							btn.style.background = syncEnabled1 ? "#4caf50" : "#0288d1"
							highlightActiveMotor1()
							updateActiveInput1()
						}
					}
					updateMap1()
				} catch (e) { console.error('Status1 parse error:', e) }
			}
		}

		function handleMessage2(topic, payload) {
			console.log('📨 MQTT2 received:', topic, payload)
			if (topic === 'Werden/auth/response/' + CLIENT_ID2) {
				try {
					const data = JSON.parse(payload)
					if (data.status === 'success') {
						authToken2 = data.token
						localStorage.setItem('servoAuthToken2', authToken2)
						document.getElementById('loginError').innerHTML += '<br>✅ Система 2 авторизована'
						checkLoginComplete()
						lastStatusTime1 = 0
						lastStatusTime2 = 0
						updateConnectionStatus()
					}
				} catch (e) { console.error('Auth2 parse error', e) }
				return
			}

			if (topic === 'Werden/status/2') {
				try {
					const data = JSON.parse(payload)
					if (!data || !data.board || data.board !== BOARD2) {
						console.log(`🚫 MQTT2 отримав чужий статус (board=${data ? data.board : 'undefined'}), ігноруємо`)
						return   // ← важливо!
					}



					console.log('📡 Отримано статус від Board 2')
					lastStatusTime2 = Date.now()
					updateConnectionStatus()

					document.getElementById("position-slider2").value = data.raw
					if (data.id == 3) {
						document.getElementById("STSValue-motor3").innerHTML = `Лівий | ID: ${data.id} | Raw: ${data.raw} | ${data.deg}° | Нап: ${data.volt || '?'}V | Нав: ${data.load || '?'}% | Швид: ${data.speed || '?'} | Темп: ${data.temp || '?'}°C | Вст.швид: ${data.set_speed || '?'}`
						document.getElementById("current-pos-motor3").textContent = `530-2750: ${data.deg}°`
						degMotor3 = data.deg
					} else if (data.id == 4) {
						document.getElementById("STSValue-motor4").innerHTML = `Правий | ID: ${data.id} | Raw: ${data.raw} | ${data.deg}° | Нап: ${data.volt || '?'}V | Нав: ${data.load || '?'}% | Швид: ${data.speed || '?'} | Темп: ${data.temp || '?'}°C | Вст.швид: ${data.set_speed || '?'}`
						document.getElementById("current-pos-motor4").textContent = `2000-6000: ${data.deg}°`
						degMotor4 = data.deg
					}
					if (data.sync !== undefined && !pendingSync2) {
						const newSync = data.sync === true
						if (newSync !== syncEnabled2) {
							syncEnabled2 = newSync
							const btn = document.getElementById('sync2Btn')
							btn.textContent = syncEnabled2 ? "Sync ON" : "Sync OFF"
							btn.style.background = syncEnabled2 ? "#4caf50" : "#0288d1"
							highlightActiveMotor2()
							updateActiveInput2()
						}
					}
					updateMap2()
				} catch (e) { console.error('Status2 parse error:', e) }
			}
		}

		// ====================== КОМАНДИ ======================
		function sendCommand1(cmdT, cmdA = 0, cmdB = 0) {
			if (!authToken1 || !mqttConnected1) { alert('Система 1 не авторизована або не підключена'); return }
			const cmdI = (cmdT === 99 || cmdT === 10) ? 0 : activeMotor1
			const payload = JSON.stringify({ token: authToken1, cmdT, cmdI, cmdA, cmdB, board: BOARD1 })
			mqttClient1.publish('Werden/command', payload)
		}

		function sendCommand2(cmdT, cmdA = 0, cmdB = 0) {
			if (!authToken2 || !mqttConnected2) { alert('Система 2 не авторизована або не підключена'); return }
			const cmdI = (cmdT === 99 || cmdT === 10) ? 0 : activeMotor2
			const payload = JSON.stringify({ token: authToken2, cmdT, cmdI, cmdA, cmdB, board: BOARD2 })
			mqttClient2.publish('Werden/command', payload)
		}

		function switchMotor1(index) {
			pendingSync1 = true

			sendCommand1(10, index)
			highlightActiveMotor1()
			updateActiveInput1()
			updateMap1()
			setTimeout(() => { pendingSync1 = false }, 1200)
		}
		function highlightActiveMotor1() {
			const btn1 = document.getElementById('motor1Btn')
			const btn2 = document.getElementById('motor2Btn')
			if (syncEnabled1) {
				btn1.classList.remove('active')
				btn2.classList.remove('active')
			} else {
				btn1.classList.toggle('active', activeMotor1 === 0)
				btn2.classList.toggle('active', activeMotor1 === 1)
			}
		}
		function updateActiveInput1() {
			const input1 = document.getElementById('degreeInput1')
			const input2 = document.getElementById('degreeInput2')
			if (syncEnabled1) {

				input2.classList.add('active')
			} else {
				input1.classList.toggle('active', activeMotor1 === 0)
				input2.classList.toggle('active', activeMotor1 === 1)
			}
		}
		function toggleSync1() {
			pendingSync1 = true
			if (!syncEnabled1) lastSingleActiveMotor1 = activeMotor1
			syncEnabled1 = !syncEnabled1
			if (!syncEnabled1) activeMotor1 = lastSingleActiveMotor1
			const btn = document.getElementById('syncBtn')
			btn.textContent = syncEnabled1 ? "Sync ON" : "Sync OFF"
			btn.style.background = syncEnabled1 ? "#4caf50" : "#0288d1"
			sendCommand1(99, syncEnabled1 ? 1 : 0)
			highlightActiveMotor1()
			updateActiveInput1()
			updateMap1()
			setTimeout(() => { pendingSync1 = false }, 1200)
		}
		function setNewMiddle1() {
			sendCommand1(11, 0)
			degMotor1 = 0; degMotor2 = 0
			document.getElementById("current-pos-motor1").textContent = `Лівий: 0°`
			document.getElementById("current-pos-motor2").textContent = `Правий: 0°`
			document.getElementById("position-slider").value = 2047
			updateMap1()
			const btn = document.getElementById('setMiddleBtn1')
			const originalBg = btn.style.background
			btn.style.background = '#4caf50'
			setTimeout(() => { btn.style.background = originalBg }, 500)
		}
		function sendDegreeFromInput1(inputEl) {
			let deg = parseFloat(inputEl.value)
			if (isNaN(deg)) return
			const motorIndex = parseInt(inputEl.dataset.motor)
			const raw = Math.round(2047 + (deg * 4095 / 360))
			if (motorIndex === 0) degMotor1 = deg; else degMotor2 = deg
			updateMap1()
			sendCommand1(22, raw)
			inputEl.value = ''
		}
		document.getElementById('degreeInput1').addEventListener('keypress', function (e) { if (e.key === 'Enter') sendDegreeFromInput1(this) })
		document.getElementById('degreeInput2').addEventListener('keypress', function (e) { if (e.key === 'Enter') sendDegreeFromInput1(this) })
		document.getElementById('position-slider').addEventListener('input', function () {
			let newPos = parseInt(this.value)
			let deg = Math.round((newPos - 2047) * 360 / 4095)
			deg = Math.max(-70, Math.min(70, deg))
			newPos = Math.round(2047 + (deg * 4095 / 360))
			this.value = newPos
			degMotor1 = deg; degMotor2 = deg
			document.getElementById("current-pos-motor1").textContent = `Лівий: ${deg}°`
			document.getElementById("current-pos-motor2").textContent = `Правий: ${deg}°`

			sendCommand1(22, newPos)

		// ====================== КАРТИ ======================
		function initMap1() {
			map1 = L.map('map').setView([48.904339, 37.605560], 10)
			L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)' }).addTo(map1)
			marker1 = L.marker([48.904339, 37.605560]).addTo(map1).bindPopup('Польовик 1').openPopup()
			outlineYellow1_1 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map1)
			outlineYellow1_2 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map1)
			arrowRed1 = L.polyline([], { color: 'red', weight: 8, opacity: 0.95 }).addTo(map1)
			arrowBlue1 = L.polyline([], { color: '#00aaff', weight: 6, opacity: 0.75, dashArray: '8, 8' }).addTo(map1)
			updateMap1()
		}
		function updateMap1() {
			if (!map1 || !marker1) return
			const center = marker1.getLatLng()
			const distance = 0.18
			const createLine = (deg) => {
				if (isNaN(deg)) return []
				const rad = deg * Math.PI / 180
				const dLat = distance * Math.cos(rad)
				const dLng = distance * Math.sin(rad) / Math.cos(center.lat * Math.PI / 180)
				return [[center.lat, center.lng], [center.lat + dLat, center.lng + dLng]]
			}
			const line1 = createLine(degMotor1)
			const line2 = createLine(degMotor2)
			arrowRed1.setLatLngs(line1)
			arrowBlue1.setLatLngs(line2)
			if (syncEnabled1) {
				outlineYellow1_1.setLatLngs([])
				outlineYellow1_2.setLatLngs([])
			} else {
				outlineYellow1_1.setLatLngs(activeMotor1 === 0 ? line1 : [])
				outlineYellow1_2.setLatLngs(activeMotor1 === 1 ? line2 : [])
			}
		}

		function initMap2() {
			map2 = L.map('map2').setView([48.904339, 37.605560], 10)
			L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)' }).addTo(map2)
			marker2 = L.marker([48.904339, 37.605560]).addTo(map2).bindPopup('Польовик 2').openPopup()
			outlineYellow2_1 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map2)
			outlineYellow2_2 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map2)
			arrowRed2 = L.polyline([], { color: 'red', weight: 8, opacity: 0.95 }).addTo(map2)
			arrowBlue2 = L.polyline([], { color: '#00aaff', weight: 6, opacity: 0.75, dashArray: '8, 8' }).addTo(map2)
			updateMap2()
		}
		function updateMap2() {
			if (!map2 || !marker2) return
			const center = marker2.getLatLng()
			const distance = 0.18
			const createLine = (deg) => {
				if (isNaN(deg)) return []
				const rad = deg * Math.PI / 180
				const dLat = distance * Math.cos(rad)
				const dLng = distance * Math.sin(rad) / Math.cos(center.lat * Math.PI / 180)
				return [[center.lat, center.lng], [center.lat + dLat, center.lng + dLng]]
			}
			const line1 = createLine(degMotor3)
			const line2 = createLine(degMotor4)
			arrowRed2.setLatLngs(line1)
			arrowBlue2.setLatLngs(line2)
			if (syncEnabled2) {
				outlineYellow2_1.setLatLngs([])
				outlineYellow2_2.setLatLngs([])
			} else {
				outlineYellow2_1.setLatLngs(activeMotor2 === 0 ? line1 : [])
				outlineYellow2_2.setLatLngs(activeMotor2 === 1 ? line2 : [])
			}
		}

		// ====================== ЗАГАЛЬНІ ФУНКЦІЇ ======================
		function tryLogin() {
			const user = document.getElementById('username').value.trim()
			const pass = document.getElementById('password').value.trim()
			const mqttUser = document.getElementById('mqttUser').value.trim()
			const mqttPass = document.getElementById('mqttPass').value.trim()
			const errorEl = document.getElementById('loginError')
			if (!user || !pass) { errorEl.textContent = 'Введіть дані пристрою'; return }
			if (!mqttUser || !mqttPass) { errorEl.textContent = 'Введіть MQTT username та password'; return }

			errorEl.textContent = 'Підключення до MQTT серверів...'
			connectMQTT1(mqttUser, mqttPass)
			connectMQTT2(mqttUser, mqttPass)

			localStorage.setItem('savedUsername', user)
			localStorage.setItem('savedPassword', pass)
			localStorage.setItem('savedMqttUser', mqttUser)
			localStorage.setItem('savedMqttPass', mqttPass)
		}

		function logout() {
			localStorage.removeItem('servoAuthToken1')
			localStorage.removeItem('servoAuthToken2')
			localStorage.removeItem('savedUsername')
			localStorage.removeItem('savedPassword')
			localStorage.removeItem('savedMqttUser')
			localStorage.removeItem('savedMqttPass')
			location.reload()
		}

		window.onload = function () {
			initMap1()
			initMap2()

			const savedUsername = localStorage.getItem('savedUsername')
			const savedPassword = localStorage.getItem('savedPassword')
			const savedMqttUser = localStorage.getItem('savedMqttUser')
			const savedMqttPass = localStorage.getItem('savedMqttPass')
			if (savedUsername) document.getElementById('username').value = savedUsername
			if (savedPassword) document.getElementById('password').value = savedPassword
			if (savedMqttUser) document.getElementById('mqttUser').value = savedMqttUser
			if (savedMqttPass) document.getElementById('mqttPass').value = savedMqttPass

			if (savedMqttUser && savedMqttPass) {
				connectMQTT1(savedMqttUser, savedMqttPass)
				connectMQTT2(savedMqttUser, savedMqttPass)
			}

			highlightActiveMotor1()
			highlightActiveMotor2()
			updateActiveInput1()
			updateActiveInput2()

			// 🔥 Автоматична перевірка статусу кожні 1.5 секунди
			setInterval(updateConnectionStatus, 1500)

			setTimeout(() => {
				if (map1) map1.invalidateSize()
				if (map2) map2.invalidateSize()
			}, 800)
		}


		// ====================== КЕРУВАННЯ КЛАВІАТУРОЮ ======================
		document.addEventListener('keydown', function (e) {

			// TAB — перемикання між системами
			if (e.key === 'Tab') {
				const isSys1 = document.getElementById('System1').classList.contains('active')

				if (isSys1) {
					openSystem({ currentTarget: document.querySelector('button[onclick*="System2"]') }, 'System2')
				} else {
					openSystem({ currentTarget: document.querySelector('button[onclick*="System1"]') }, 'System1')
				}

				document.activeElement.blur()
				e.preventDefault()
				return
			}

			const sys1Active = document.getElementById('System1').classList.contains('active')
			const sys2Active = document.getElementById('System2').classList.contains('active')

			// ====================== КОМАНДИ, ЯКІ ПРАЦЮЮТЬ НАВІТЬ ПРИ ФОКУСІ В ПОЛІ ======================

			// Синхронізація (S / і) — працює завжди
			if (e.key === 's' || e.key === 'S' || e.key === 'і' || e.key === 'І') {
				if (sys1Active) toggleSync1()
				if (sys2Active) toggleSync2()
				e.preventDefault()        // щоб не вводилась літера в поле
				return
			}

			// Перемикання моторів (працює завжди)
			const isLeftMotorKey = (e.key === 'й' || e.key === 'Й' || e.key.toLowerCase() === 'q') && !e.altKey
			const isRightMotorKey = (e.key === 'й' || e.key === 'Й' || e.key.toLowerCase() === 'q') && e.altKey

			if (isLeftMotorKey) {
				if (sys1Active) {
					switchMotor1(0)
					focusDegreeInput('degreeInput1')
				} else if (sys2Active) {
					switchMotor2(0)
					focusDegreeInput('degreeInput3')
				}
				e.preventDefault()
				return
			}

			if (isRightMotorKey) {
				if (sys1Active) {
					switchMotor1(1)
					focusDegreeInput('degreeInput2')
				} else if (sys2Active) {
					switchMotor2(1)
					focusDegreeInput('degreeInput4')
				}
				e.preventDefault()
				return
			}

			// ====================== КОМАНДИ, ЯКІ ПРАЦЮЮТЬ ТІЛЬКИ БЕЗ ФОКУСУ ======================
			const hasFocus = document.activeElement.tagName === "INPUT" &&
				document.activeElement.type !== "range"

			if (hasFocus) return   // блокуємо решту клавіш, якщо фокус у полі

			switch (e.key) {

				case 'ArrowLeft':     // Швидкість -
					if (sys1Active) sendCommand1(8, activeMotor1)
					if (sys2Active) sendCommand2(8, activeMotor2)
					break

				case 'ArrowRight':    // Швидкість +
					if (sys1Active) sendCommand1(7, activeMotor1)
					if (sys2Active) sendCommand2(7, activeMotor2)
					break

				case '0':
					if (sys1Active) sendCommand1(1, activeMotor1)
					if (sys2Active) sendCommand2(1, activeMotor2)
					break
			}
		})

		// ====================== ДОПОМІЖНА ФУНКЦІЯ ======================
		function focusDegreeInput(inputId) {
			document.querySelectorAll('.azimuth-input').forEach(el => el.blur())

			const input = document.getElementById(inputId)
			if (input) {
				setTimeout(() => {
					input.focus()
					input.select()
				}, 10)
			}
		}
