<!DOCTYPE HTML>
<html>

<head>
	<title>Польовик – Керування сервоприводом</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			font-family: Arial, sans-serif;
			background: #000;
			color: #eee;
			overflow: hidden;
		}

		#warningBanner {
			background: #ff4444;
			color: white;
			padding: 12px;
			text-align: center;
			font-weight: bold;
			position: fixed;
			top: 0;
			width: 100%;
			z-index: 2000;
		}

		#loginScreen {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.9);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		#mainContent {
			display: none;
			padding: 60px 20px 20px;
			max-width: 600px;
			margin: 0 auto;
		}

		h3 {
			margin: 10px 0;
			text-align: center;
		}

		.buttonContainer {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 12px;
			margin: 20px 0;
		}

		button {
			padding: 12px 24px;
			font-size: 18px;
			background: #4247b7;
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			min-width: 60px;
		}

		#motor1Btn,
		#motor2Btn {
			transition: all 0.25s ease;
		}

		#motor1Btn.active,
		#motor2Btn.active {
			border: 4px solid #ffff00 !important;
			box-shadow: 0 0 15px #ffff00;
			background: #5a5fff;
		}

		button:hover {
			background: #ff494d;
		}

		button:active {
			background: #d32f2f;
		}

		#syncBtn {
			background: #0288d1;
		}

		#syncBtn.on {
			background: #4caf50;
		}

		#slider-container {
			margin: 25px 0;
			text-align: center;
		}

		#position-slider {
			width: 90%;
			height: 14px;
			background: linear-gradient(to right, #333, #4247b7, #333);
			border-radius: 10px;
			appearance: none;
		}

		#position-slider::-webkit-slider-thumb {
			width: 44px;
			height: 44px;
			background: #ff494d;
			border-radius: 50%;
			border: 4px solid white;
			cursor: pointer;
		}

		#current-pos {
			font-size: 20px;
			margin: 12px 0;
			text-align: center;
		}

		#STSValue {
			font-size: 16px;
			text-align: center;
			margin: 15px 0;
			padding: 12px;
			background: #111;
			border-radius: 8px;
		}

		#map {
			height: 320px;
			border: 2px solid #4247b7;
			border-radius: 10px;
			margin-top: 25px;
		}

		input[type="text"],
		input[type="password"] {
			width: 300px;
			padding: 14px;
			margin: 12px;
			font-size: 17px;
			border-radius: 8px;
			border: 1px solid #555;
			background: #222;
			color: white;
		}

		#loginBtn {
			padding: 16px 50px;
			font-size: 20px;
			background: #28a745;
			border: none;
			border-radius: 8px;
			color: white;
			cursor: pointer;
		}

		#loginBtn:hover {
			background: #218838;
		}

		#loginError {
			color: #ff4444;
			margin-top: 15px;
			min-height: 24px;
			font-size: 16px;
		}

		#logoutBtn {
			position: absolute;
			top: 70px;
			right: 20px;
			padding: 10px 20px;
			background: #d32f2f;
			font-size: 16px;
		}
	</style>
</head>

<body>

	<div id="warningBanner">⚠️ Знаходиться в розробці.</div>

	<div id="loginScreen">
		<h2>Польовик – Авторизація</h2>
		<input type="text" id="username" placeholder="Ім'я користувача пристрою" autocomplete="off">
		<input type="password" id="password" placeholder="Пароль пристрою" autocomplete="off">
		<input type="text" id="mqttUser" placeholder="MQTT Username (наприклад web-guest)" autocomplete="off">
		<input type="password" id="mqttPass" placeholder="MQTT Password" autocomplete="off">
		<button id="loginBtn" onclick="tryLogin()">Увійти</button>
		<div id="loginError"></div>
	</div>

	<div id="mainContent">
		<h3>Польовик</h3>
		<div class="StsValue" id="STSValue">Очікування даних сервоприводу...</div>

		<div class="buttonContainer">
			<button id="motor1Btn" onclick="switchMotor(0)">Motor 1</button>
			<button id="motor2Btn" onclick="switchMotor(1)">Motor 2</button>
			<button id="syncBtn" onclick="toggleSync()" style="padding:12px 30px; background:#0288d1; color:white;">Sync
				OFF</button>
			<button onmousedown="toggleCheckbox(1,6,0,0)" ontouchstart="toggleCheckbox(1,6,0,0)"
				onmouseup="toggleCheckbox(1,2,0,0)" ontouchend="toggleCheckbox(1,2,0,0)">
				< </button>
					<button onclick="toggleCheckbox(1,1,0,0)">0°</button>
					<button onmousedown="toggleCheckbox(1,5,0,0)" ontouchstart="toggleCheckbox(1,5,0,0)"
						onmouseup="toggleCheckbox(1,2,0,0)" ontouchend="toggleCheckbox(1,2,0,0)">></button>
					<button onclick="toggleCheckbox(1,7,0,0)">+</button>
					<button onclick="toggleCheckbox(1,8,0,0)">-</button>
		</div>

		<div id="slider-container">
			<input type="range" id="position-slider" min="0" max="4095" value="2047" step="any">
		</div>
		<input type="number" id="position-input" min="0" max="4095" value="2047" style="display:none;">
		<p id="current-pos">Поточна позиція: 0°</p>

		<div style="margin:25px 0; text-align:center;">
			<input type="number" id="degreeInput" min="-180" max="180" step="0.1" placeholder=""
				title="Введіть градуси (-180..180)"
				style="width:230px; padding:12px; font-size:18px; border-radius:8px; border:1px solid #555; background:#222; color:white;">
			<button onclick="setDegree()"
				style="padding:12px 30px; margin-left:12px; font-size:18px; background:#ff4444;">Перейти до градуса</button>
		</div>

		<div id="map"></div>

		<button id="logoutBtn" onclick="logout()">Вийти</button>
	</div>

	<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script>
		// ── MQTT Config ──────────────────────────────────────────────
		const MQTT_BROKER = 'wss://940d7f06dbf1455c841afb26f9c5cf1c.s1.eu.hivemq.cloud:8884/mqtt'
		const CLIENT_ID = 'web-client-' + Math.random().toString(16).substr(2, 8)

		let authToken = localStorage.getItem('servoAuthToken') || ''
		let mqttConnected = false
		let mqttClient = null

		// Motor state
		let degMotor1 = 0       // red line – Motor 1
		let degMotor2 = 0       // blue dashed – Motor 2
		let activeMotor = 0     // 0 = Motor 1, 1 = Motor 2
		let pendingSwitch = false  // NEW: prevent bounce during switch

		// Map layers
		let map, marker, arrowRed, arrowBlue, outlineYellow1, outlineYellow2

		// ── Connect to MQTT ──────────
		function connectMQTT(mqttUser, mqttPass) {
			mqttClient = mqtt.connect(MQTT_BROKER, {
				clientId: CLIENT_ID,
				username: mqttUser,
				password: mqttPass,
				clean: true,
				reconnectPeriod: 5000
			})

			mqttClient.on('connect', () => {
				mqttConnected = true
				console.log('MQTT connected')
				document.getElementById('loginError').textContent = 'Підключено до сервера'

				mqttClient.subscribe('Werden/auth/response/' + CLIENT_ID)
				mqttClient.subscribe('Werden/status')
			})

			mqttClient.on('message', (topic, message) => {
				const payload = message.toString()
				console.log('MQTT:', topic, payload)

				if (topic === 'Werden/auth/response/' + CLIENT_ID) {
					try {
						const data = JSON.parse(payload)
						if (data.status === 'success') {
							authToken = data.token
							localStorage.setItem('servoAuthToken', authToken)
							document.getElementById('loginScreen').style.display = 'none'
							document.getElementById('mainContent').style.display = 'block'
							document.getElementById('loginError').textContent = ''
						} else {
							document.getElementById('loginError').textContent = data.reason || 'Помилка авторизації'
						}
					} catch (e) {
						document.getElementById('loginError').textContent = 'Неправильна відповідь сервера'
					}
				}

				if (topic === 'Werden/status') {
					try {
						const data = JSON.parse(payload)

						// Update UI (shows currently active motor)
						document.getElementById("STSValue").innerHTML =
							`ID: ${data.id} | Raw: ${data.raw} | ${data.deg}° | Нап: ${data.volt || '?'}V | Нав: ${data.load || '?'}% | Швид: ${data.speed || '?'} | Темп: ${data.temp || '?'}°C | Вст.швид: ${data.set_speed || '?'}`
						document.getElementById("position-slider").value = data.raw
						document.getElementById("current-pos").textContent = `Поточна позиція: ${data.deg}°`

						// Store last known angle per motor
						if (data.id == 1) degMotor1 = data.deg
						else if (data.id == 2) degMotor2 = data.deg

						// Update activeMotor ONLY if not pending switch (anti-bounce)
						if (!pendingSwitch) {
							if (data.activeIndex !== undefined) {
								activeMotor = data.activeIndex
							} else {
								activeMotor = (data.id == 1) ? 0 : 1
							}
							highlightActiveMotor()
						}

						updateMapDirection()

					} catch (e) {
						console.error('Status parse error:', e)
					}
				}
			})

			mqttClient.on('error', (err) => {
				console.error('MQTT error:', err)
				document.getElementById('loginError').textContent = 'Помилка підключення до MQTT сервера'
			})
		}

		// ── Login process ─────────────────────────────────────────────
		function tryLogin() {
			const user = document.getElementById('username').value.trim()
			const pass = document.getElementById('password').value.trim()
			const mqttUser = document.getElementById('mqttUser').value.trim()
			const mqttPass = document.getElementById('mqttPass').value.trim()
			const errorEl = document.getElementById('loginError')

			if (!user || !pass) { errorEl.textContent = 'Введіть дані пристрою'; return }
			if (!mqttUser || !mqttPass) { errorEl.textContent = 'Введіть MQTT username та password'; return }

			errorEl.textContent = 'Підключення до сервера...'

			connectMQTT(mqttUser, mqttPass)

			setTimeout(() => {
				if (mqttConnected) {
					errorEl.textContent = 'Авторизація пристрою...'
					const payload = JSON.stringify({
						username: user,
						password: pass,
						clientId: CLIENT_ID
					})
					mqttClient.publish('Werden/auth/request', payload)
				}
			}, 2000)
		}

		// ── Commands ──────────────────────────────────────────────────
		function sendCommand(cmdT, cmdI, cmdA = 0, cmdB = 0) {
			if (!authToken || !mqttConnected) {
				alert('Спочатку авторизуйтесь та підключіться')
				return
			}
			const payload = JSON.stringify({ token: authToken, cmdT, cmdI, cmdA, cmdB })
			mqttClient.publish('Werden/command', payload)
		}

		function switchMotor(index) {
			pendingSwitch = true  // NEW: start pending
			activeMotor = index
			sendCommand(10, 0, index, 0)
			highlightActiveMotor()
			updateMapDirection()

			// Clear pending after 1s (enough for next status)
			setTimeout(() => { pendingSwitch = false }, 1000)
		}

		function highlightActiveMotor() {
			const btn1 = document.getElementById('motor1Btn')
			const btn2 = document.getElementById('motor2Btn')
			btn1.classList.toggle('active', activeMotor === 0)
			btn2.classList.toggle('active', activeMotor === 1)
		}

		let syncEnabled = false
		function toggleSync() {
			syncEnabled = !syncEnabled
			const btn = document.getElementById('syncBtn')
			btn.textContent = syncEnabled ? "Sync ON" : "Sync OFF"
			btn.style.background = syncEnabled ? "#4caf50" : "#0288d1"
			sendCommand(99, 0, syncEnabled ? 1 : 0, 0)
		}

		function setDegree() {
			const degInput = document.getElementById('degreeInput')
			let deg = parseFloat(degInput.value)
			if (isNaN(deg)) { alert('Введіть коректне число градусів'); return }
			deg = Math.max(-180, Math.min(180, deg))
			const raw = Math.round(2047 + (deg * 4095 / 360))

			// Optimistic update (reduce perceived latency)
			document.getElementById("position-slider").value = raw
			document.getElementById("current-pos").textContent = `Поточна позиція: ${deg}°`
			if (activeMotor === 0) degMotor1 = deg
			else degMotor2 = deg
			updateMapDirection()

			sendCommand(22, 0, raw, 0)
			degInput.value = ''
		}

		function toggleCheckbox(inputT, inputI, inputA, inputB) {
			sendCommand(inputT, inputI, inputA, inputB)
		}

		document.getElementById('position-slider').addEventListener('input', function () {
			const newPos = parseInt(this.value)
			const deg = Math.round((newPos - 2047) * 360 / 4095)

			// Optimistic update
			document.getElementById("current-pos").textContent = `Поточна позиція: ${deg}°`
			if (activeMotor === 0) degMotor1 = deg
			else degMotor2 = deg
			updateMapDirection()

			sendCommand(22, 0, newPos, 0)
		})

		function logout() {
			localStorage.removeItem('servoAuthToken')
			localStorage.removeItem('mqttUser')
			localStorage.removeItem('mqttPass')
			location.reload()
		}

		// ── Map ───────────────────────────────────────────────────────
		function initMap() {
			map = L.map('map').setView([48.904339, 37.605560], 10)
			L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
				attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)',
				maxZoom: 17
			}).addTo(map)

			marker = L.marker([48.904339, 37.605560]).addTo(map)
				.bindPopup('Польовик').openPopup()

			// Yellow outlines (glow) for selected motor
			outlineYellow1 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map)
			outlineYellow2 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map)

			// Fixed color arrows
			arrowRed = L.polyline([], { color: 'red', weight: 8, opacity: 0.95 }).addTo(map)           // Motor 1
			arrowBlue = L.polyline([], { color: '#00aaff', weight: 6, opacity: 0.75, dashArray: '8, 8' }).addTo(map) // Motor 2

			updateMapDirection()
		}

		function updateMapDirection() {
			if (!map || !marker) return
			const center = marker.getLatLng()
			const distance = 0.18

			const createLine = (deg) => {
				if (isNaN(deg)) return []
				const rad = deg * Math.PI / 180
				const dLat = distance * Math.cos(rad)
				const dLng = distance * Math.sin(rad) / Math.cos(center.lat * Math.PI / 180)
				return [[center.lat, center.lng], [center.lat + dLat, center.lng + dLng]]
			}

			// Motor 1 – red
			const line1 = createLine(degMotor1)
			arrowRed.setLatLngs(line1)
			outlineYellow1.setLatLngs(activeMotor === 0 ? line1 : [])

			// Motor 2 – blue dashed
			const line2 = createLine(degMotor2)
			arrowBlue.setLatLngs(line2)
			outlineYellow2.setLatLngs(activeMotor === 1 ? line2 : [])
		}

		// ── Initialization ────────────────────────────────────────────
		window.onload = function () {
			document.getElementById("position-slider").value = 2047
			document.getElementById("position-input").value = 2047
			document.getElementById("current-pos").textContent = 'Поточна позиція: 0°'

			initMap()
			highlightActiveMotor()   // default: Motor 1 selected

			const savedMqttUser = localStorage.getItem('mqttUser')
			const savedMqttPass = localStorage.getItem('mqttPass')
			if (savedMqttUser && savedMqttPass) {
				connectMQTT(savedMqttUser, savedMqttPass)
				if (authToken) {
					document.getElementById('loginScreen').style.display = 'none'
					document.getElementById('mainContent').style.display = 'block'
				}
			}
		};
	</script>
</body>

</html>
