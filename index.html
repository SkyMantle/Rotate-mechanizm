<!DOCTYPE HTML>
<html>

<head>
	<title>Польовик – Керування сервоприводом</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			font-family: Arial, sans-serif;
			background: #000;
			color: #eee;
			overflow: hidden;
		}

		#warningBanner {
			background: #ff4444;
			color: white;
			padding: 12px;
			text-align: center;
			font-weight: bold;
			position: fixed;
			top: 0;
			width: 100%;
			z-index: 2000;
		}

		#loginScreen {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.9);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		#mainContent {
			display: none;
			padding: 60px 20px 20px;
			max-width: 600px;
			margin: 0 auto;
		}

		h3 {
			margin: 10px 0;
			text-align: center;
		}

		.buttonContainer {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 12px;
			margin: 20px 0;
		}

		.motorSelectContainer {
			display: flex;
			gap: 12px;
		}

		.motorControlContainer {
			display: flex;
			gap: 12px;
		}

		button {
			padding: 12px 24px;
			font-size: 14px;
			background: #4247b7;
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			min-width: 60px;
			position: relative;
			overflow: hidden;
			text-align: center;
		}

		#motor3Btn,
		#motor4Btn {
			transition: all 0.25s ease;
		}

		#motor3Btn.active,
		#motor4Btn.active {
			border: 1px solid #ffff00 !important;
			box-shadow: 0 0 15px #ffff00;
			background: #5a5fff;
		}

		button:hover {
			background: #ff494d;
		}

		button:active {
			background: #d32f2f;
		}

		#sync2Btn {
			background: #0288d1;
			width: 170px !important;
			min-width: 170px !important;
			max-width: 170px !important;
			text-align: center;
			box-sizing: border-box;
			padding: 12px 20px;
			flex-shrink: 0;
		}

		#sync2Btn.on {
			background: #4caf50;
		}

		#slider-container2 {
			margin: 2px 0;
			text-align: center;
		}

		#position-slider2 {
			width: 65%;
			height: 14px;
			background: linear-gradient(to right, #444 0%, #444 30%, #4247b7 30%, #4247b7 70%, #444 70%, #444 100%);
			border-radius: 10px;
			appearance: none;
			outline: none;
		}

		#position-slider2::-webkit-slider-thumb {
			width: 44px;
			height: 44px;
			background: #ff494d;
			border-radius: 50%;
			border: 4px solid white;
			cursor: pointer;
		}

		.motorAzimuthContainer {
			display: flex;
			justify-content: space-around;
			gap: 40px;
			margin-top: 2px;
		}

		.motor-pos {
			font-size: 20px;
			margin: 8px 0;
			text-align: center;
		}

		.STSInfoContainer {
			display: flex;
			flex-direction: row;
			justify-content: space-around;
		}

		.STSValue {
			max-width: 40%;
			height: 70px;
			font-size: 16px;
			text-align: center;
			margin: 10px 0;
			padding: 10px;
			background: #111;
			border-radius: 8px;
		}

		#map2 {
			height: 320px;
			border: 2px solid #4247b7;
			border-radius: 10px;
			margin-top: 25px;
		}

		/* Separate azimuth inputs with active indication */
		.azimuth-group {
			display: flex;
			flex-direction: row;
			align-items: center;
			gap: 6px;
			justify-content: center;
		}

		.azimuth-input {
			max-width: 60%;
			width: 230px;
			padding: 12px;
			font-size: 18px;
			border-radius: 8px;
			border: 1px solid #555;
			background: #222;
			color: white;
			-moz-appearance: textfield;
			transition: all 0.25s ease;
		}

		.azimuth-input.active {
			border: 2px solid #ffff00 !important;
			box-shadow: 0 0 15px #ffff00;
		}

		.azimuth-input::-webkit-outer-spin-button,
		.azimuth-input::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		input[type="text"],
		input[type="password"] {
			width: 300px;
			padding: 14px;
			margin: 12px;
			font-size: 17px;
			border-radius: 8px;
			border: 1px solid #555;
			background: #222;
			color: white;
		}

		#loginBtn {
			padding: 16px 50px;
			font-size: 20px;
			background: #28a745;
			border: none;
			border-radius: 8px;
			color: white;
			cursor: pointer;
		}

		#loginBtn:hover {
			background: #218838;
		}

		#loginError {
			color: #ff4444;
			margin-top: 15px;
			min-height: 24px;
			font-size: 16px;
		}

		#logoutBtn {
			position: absolute;
			top: 70px;
			right: 20px;
			padding: 10px 20px;
			background: #d32f2f;
			font-size: 16px;
		}
	</style>
</head>

<body>

	<div id="warningBanner">⚠️ Знаходиться в розробці.</div>

	<div id="loginScreen">
		<h2>Польовик – Авторизація</h2>
		<input type="text" id="username" placeholder="Ім'я користувача пристрою" autocomplete="off">
		<input type="password" id="password" placeholder="Пароль пристрою" autocomplete="off">
		<input type="text" id="mqttUser" placeholder="MQTT Username (наприклад web-guest)" autocomplete="off">
		<input type="password" id="mqttPass" placeholder="MQTT Password" autocomplete="off">
		<button id="loginBtn" onclick="tryLogin()">Увійти</button>
		<div id="loginError"></div>
	</div>

	<div id="mainContent">
		<h3>Польовик</h3>
		<div class="STSInfoContainer">
			<div class="STSValue" id="STSValue-motor3">Лівий: Очікування даних сервоприводу...</div>
			<div class="STSValue" id="STSValue-motor4">Правий: Очікування даних сервоприводу...</div>
		</div>
		<div class="buttonContainer">
			<div class="motorSelectContainer">
				<button id="motor3Btn" onclick="switchMotor(0)">Ліва</button>
				<button id="motor4Btn" onclick="switchMotor(1)">Права</button>
				<button id="sync2Btn" onclick="toggleSync()">Sync OFF</button>
			</div>
			<div class="motorControlContainer">
				<button id="setMiddleBtn2" onclick="setNewMiddle()">Set New 0°</button>
				<button onclick="sendCommand(3, activeMotor)">Release</button>
				<button onclick="sendCommand(4, activeMotor)">Torque</button>
				<button onclick="sendCommand(1, activeMotor)">0°</button>
				<button onclick="sendCommand(7, activeMotor)">+</button>
				<button onclick="sendCommand(8, activeMotor)">-</button>
			</div>
		</div>

		<div id="slider-container2">
			<input type="range" id="position-slider2" min="0" max="4095" value="2047" step="any">
		</div>

		<div class="motorAzimuthContainer">
			<p class="motor-pos" id="current-pos-motor3">Лівий: 0°</p>
			<p class="motor-pos" id="current-pos-motor4">Правий: 0°</p>
		</div>

		<!-- Separate inputs for each motor -->
		<div
			style="margin:2px 0; text-align:center; display:flex; flex-direction:row; justify-content: space-around; align-items:center; flex-wrap: wrap; gap:20px;">
			<div class="azimuth-group">
				<label for="degreeInput3" style="font-size:18px;"></label>
				<input type="number" id="degreeInput3" min="-77" max="77" step="0.1" placeholder="градуси" class="azimuth-input"
					data-motor="0">
			</div>

			<div class="azimuth-group">
				<label for="degreeInput4" style="font-size:18px;"></label>
				<input type="number" id="degreeInput4" min="-77" max="77" step="0.1" placeholder="градуси" class="azimuth-input"
					data-motor="1">
			</div>
		</div>

		<div id="map2"></div>

		<button id="logoutBtn" onclick="logout()">Вийти</button>
	</div>

	<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script>
		const MQTT_BROKER = 'wss://c57fd02a32a645b5b10ab4e7833a2fa6.s1.eu.hivemq.cloud:8884/mqtt'
		const CLIENT_ID = 'web-client-' + Math.random().toString(16).substr(2, 8)
		const BOARD = 2

		let authToken = localStorage.getItem('servoAuthToken') || ''
		let mqttConnected = false
		let mqttClient = null

		let degMotor3 = 0
		let degMotor4 = 0
		let activeMotor = 0
		let pendingSwitch = false

		let syncEnabled = false
		let pendingSync = false
		let lastSingleActiveMotor = 0

		let map2, marker2, arrowRed2, arrowBlue2, outlineYellow3, outlineYellow4

		function connectMQTT(mqttUser, mqttPass) {
			mqttClient = mqtt.connect(MQTT_BROKER, {
				clientId: CLIENT_ID,
				username: mqttUser,
				password: mqttPass,
				clean: true,
				reconnectPeriod: 5000
			})

			mqttClient.on('connect', () => {
				mqttConnected = true
				console.log('MQTT connected')
				document.getElementById('loginError').textContent = 'Підключено до сервера'

				mqttClient.subscribe('Werden/auth/response/' + CLIENT_ID)
				mqttClient.subscribe('Werden/status')
			})

			mqttClient.on('message', (topic, message) => {
				const payload = message.toString()
				console.log('MQTT:', topic, payload)

				if (topic === 'Werden/auth/response/' + CLIENT_ID) {
					try {
						const data = JSON.parse(payload)
						if (data.status === 'success') {
							authToken = data.token
							localStorage.setItem('servoAuthToken', authToken)

							// NEW: Save ALL login fields after successful auth
							localStorage.setItem('savedUsername', document.getElementById('username').value.trim())
							localStorage.setItem('savedPassword', document.getElementById('password').value.trim())
							localStorage.setItem('savedMqttUser', document.getElementById('mqttUser').value.trim())
							localStorage.setItem('savedMqttPass', document.getElementById('mqttPass').value.trim())

							document.getElementById('loginScreen').style.display = 'none'
							document.getElementById('mainContent').style.display = 'block'
							document.getElementById('loginError').textContent = ''

							// FIX: Force map2 redraw after main content is visible
							setTimeout(() => {
								if (map2) {
									map2.invalidateSize()
								}
							}, 100)
						} else {
							document.getElementById('loginError').textContent = data.reason || 'Помилка авторизації'
						}
					} catch (e) {
						document.getElementById('loginError').textContent = 'Неправильна відповідь сервера'
					}
				}

				if (topic === 'Werden/status') {
					try {
						const data = JSON.parse(payload)
						if (data.board && data.board !== BOARD) return

						document.getElementById("position-slider2").value = data.raw

						if (data.id == 3) {
							document.getElementById("STSValue-motor3").innerHTML =
								`Лівий | ID: ${data.id} | Raw: ${data.raw} | ${data.deg}° | Нап: ${data.volt || '?'}V | Нав: ${data.load || '?'}% | Швид: ${data.speed || '?'} | Темп: ${data.temp || '?'}°C | Вст.швид: ${data.set_speed || '?'}`
							document.getElementById("current-pos-motor3").textContent = `Лівий: ${data.deg}°`
							degMotor3 = data.deg
						} else if (data.id == 4) {
							document.getElementById("STSValue-motor4").innerHTML =
								`Правий | ID: ${data.id} | Raw: ${data.raw} | ${data.deg}° | Нап: ${data.volt || '?'}V | Нав: ${data.load || '?'}% | Швид: ${data.speed || '?'} | Темп: ${data.temp || '?'}°C | Вст.швид: ${data.set_speed || '?'}`
							document.getElementById("current-pos-motor4").textContent = `Правий: ${data.deg}°`
							degMotor4 = data.deg
						}

						if (data.sync !== undefined && !pendingSync) {
							const newSync = data.sync === true
							if (newSync !== syncEnabled) {
								syncEnabled = newSync
								const btn = document.getElementById('sync2Btn')
								btn.textContent = syncEnabled ? "Sync ON" : "Sync OFF"
								btn.style.background = syncEnabled ? "#4caf50" : "#0288d1"
								highlightActiveMotor()
								updateActiveInput() // NEW
							}
						}

						updateMap2()

					} catch (e) {
						console.error('Status parse error:', e)
					}
				}
			})

			mqttClient.on('error', (err) => {
				console.error('MQTT error:', err)
				document.getElementById('loginError').textContent = 'Помилка підключення до MQTT сервера'
			})
		}

		function tryLogin() {
			const user = document.getElementById('username').value.trim()
			const pass = document.getElementById('password').value.trim()
			const mqttUser = document.getElementById('mqttUser').value.trim()
			const mqttPass = document.getElementById('mqttPass').value.trim()
			const errorEl = document.getElementById('loginError')

			if (!user || !pass) { errorEl.textContent = 'Введіть дані пристрою'; return }
			if (!mqttUser || !mqttPass) { errorEl.textContent = 'Введіть MQTT username та password'; return }

			errorEl.textContent = 'Підключення до сервера...'

			connectMQTT(mqttUser, mqttPass)

			setTimeout(() => {
				if (mqttConnected) {
					errorEl.textContent = 'Авторизація пристрою...'
					const payload = JSON.stringify({
						username: user,
						password: pass,
						clientId: CLIENT_ID
					})
					mqttClient.publish('Werden/auth/request', payload)
				}
			}, 2000)
		}

		function sendCommand(cmdT, cmdA = 0, cmdB = 0) {
			if (!authToken || !mqttConnected) {
				alert('Спочатку авторизуйтесь та підключіться')
				return
			}
			const cmdI = (cmdT === 99 || cmdT === 10) ? 0 : activeMotor
			const payload = JSON.stringify({ token: authToken, cmdT, cmdI, cmdA, cmdB, board: BOARD })
			mqttClient.publish('Werden/command', payload)
		}

		function switchMotor(index) {
			pendingSwitch = true
			activeMotor = index
			lastSingleActiveMotor = index
			sendCommand(10, index)
			highlightActiveMotor()
			updateActiveInput()
			updateMap2()
			setTimeout(() => { pendingSwitch = false }, 1200)
		}

		function highlightActiveMotor() {
			const btn3 = document.getElementById('motor3Btn')
			const btn4 = document.getElementById('motor4Btn')
			if (syncEnabled) {
				btn3.classList.remove('active')
				btn4.classList.remove('active')
			} else {
				btn3.classList.toggle('active', activeMotor === 0)
				btn4.classList.toggle('active', activeMotor === 1)
			}
		}

		// NEW: Highlight active input field
		function updateActiveInput() {
			const input3 = document.getElementById('degreeInput3')
			const input4 = document.getElementById('degreeInput4')

			if (syncEnabled) {
				input3.classList.add('active')
				input4.classList.add('active')
			} else {
				input3.classList.toggle('active', activeMotor === 0)
				input4.classList.toggle('active', activeMotor === 1)
			}
		}

		function toggleSync() {
			pendingSync = true

			if (!syncEnabled) {
				lastSingleActiveMotor = activeMotor
			}

			syncEnabled = !syncEnabled

			if (!syncEnabled) {
				activeMotor = lastSingleActiveMotor
			}

			const btn = document.getElementById('sync2Btn')
			btn.textContent = syncEnabled ? "Sync ON" : "Sync OFF"
			btn.style.background = syncEnabled ? "#4caf50" : "#0288d1"
			sendCommand(99, syncEnabled ? 1 : 0)
			highlightActiveMotor()
			updateActiveInput()
			updateMap2()

			setTimeout(() => { pendingSync = false }, 1200)
		}

		function startMove(cmdT) {
			const currentDeg = activeMotor === 0 ? degMotor3 : degMotor4

			if (cmdT === 5 && currentDeg >= 77) return
			if (cmdT === 6 && currentDeg <= -77) return

			sendCommand(cmdT, 0)
		}

		function stopMove() {
			sendCommand(2, 0)
		}

		// NEW: Send degree from specific input (shared for both)
		function sendDegreeFromInput(inputEl) {
			let deg = parseFloat(inputEl.value)
			if (isNaN(deg)) return

			const motorIndex = parseInt(inputEl.dataset.motor)
			const raw = Math.round(2047 + (deg * 4095 / 360))

			// Optimistic update
			if (motorIndex === 0) degMotor3 = deg
			else degMotor4 = deg

			updateMap2()
			sendCommand(22, raw)

			inputEl.value = '' // Clear after send
		}

		// NEW: Enter key support + clear
		document.getElementById('degreeInput3').addEventListener('keypress', function (e) {
			if (e.key === 'Enter') {
				sendDegreeFromInput(this)
			}
		})

		document.getElementById('degreeInput4').addEventListener('keypress', function (e) {
			if (e.key === 'Enter') {
				sendDegreeFromInput(this)
			}
		})


		function setNewMiddle() {
			// Send calibration command using cmdT=11 (as you confirmed)
			// cmdI = current active motor index
			// cmdA and cmdB = 0 (not needed for calibration)
			sendCommand(11, 0)  // cmdT=11 triggers setMiddle() in firmware

			// Optimistic reset: current position is now 0°
			degMotor3 = 0
			degMotor4 = 0

			// Update UI positions immediately
			document.getElementById("current-pos-motor3").textContent = `Лівий: 0°`
			document.getElementById("current-pos-motor4").textContent = `Правий: 0°`

			// Reset slider to visual middle
			document.getElementById("position-slider2").value = 2047

			// Reset map2 arrows to straight forward (0° direction)
			updateMap2()

			// Visual feedback (orange button flashes green briefly)
			const btn = document.getElementById('setMiddleBtn2')
			const originalBg = btn.style.background
			btn.style.background = '#4caf50'
			setTimeout(() => { btn.style.background = originalBg }, 500)
		}

		document.getElementById('position-slider2').addEventListener('input', function () {
			let newPos = parseInt(this.value)
			let deg = Math.round((newPos - 2047) * 360 / 4095)
			deg = Math.max(-77, Math.min(77, deg))
			newPos = Math.round(2047 + (deg * 4095 / 360))
			this.value = newPos
			degMotor3 = deg
			degMotor4 = deg
			document.getElementById("current-pos-motor3").textContent = `Лівий: ${deg}°`
			document.getElementById("current-pos-motor4").textContent = `Правий: ${deg}°`
			updateMap2()
			sendCommand(22, newPos)
		})

		function logout() {
			localStorage.removeItem('servoAuthToken')
			localStorage.removeItem('mqttUser')
			localStorage.removeItem('mqttPass')
			location.reload()
		}

		function initMap2() {
			map2 = L.map('map2').setView([48.904339, 37.605560], 10)
			L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
				attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetmap</a> contributors, SRTM | © <a href="https://opentopomap.org">OpenTopomap</a> (CC-BY-SA)',
				maxZoom: 17
			}).addTo(map2)

			marker2 = L.marker([48.904339, 37.605560]).addTo(map2)
				.bindPopup('Польовик').openPopup()

			outlineYellow3 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map2)
			outlineYellow4 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map2)

			arrowRed2 = L.polyline([], { color: 'red', weight: 8, opacity: 0.95 }).addTo(map2)
			arrowBlue2 = L.polyline([], { color: '#00aaff', weight: 6, opacity: 0.75, dashArray: '8, 8' }).addTo(map2)

			updateMap2()
		}

		function updateMap2() {
			if (!map2 || !marker2) return
			const center = marker2.getLatLng()
			const distance = 0.18

			const createLine = (deg) => {
				if (isNaN(deg)) return []
				const rad = deg * Math.PI / 180
				const dLat = distance * Math.cos(rad)
				const dLng = distance * Math.sin(rad) / Math.cos(center.lat * Math.PI / 180)
				return [[center.lat, center.lng], [center.lat + dLat, center.lng + dLng]]
			}

			arrowRed2.setLatLngs(createLine(degMotor3))
			arrowBlue2.setLatLngs(createLine(degMotor4))

			if (syncEnabled) {
				outlineYellow3.setLatLngs([])
				outlineYellow4.setLatLngs([])
			} else {
				outlineYellow3.setLatLngs(activeMotor === 0 ? createLine(degMotor3) : [])
				outlineYellow4.setLatLngs(activeMotor === 1 ? createLine(degMotor4) : [])
			}
		}

		window.onload = function () {
			document.getElementById("position-slider2").value = 2047

			initMap2()
			highlightActiveMotor()
			updateActiveInput()

			// FIX: Force map2 redraw after init (in case content was hidden)
			setTimeout(() => {
				if (map2) {
					map2.invalidateSize()
				}
			}, 300)

			const savedUsername = localStorage.getItem('savedUsername')
			const savedPassword = localStorage.getItem('savedPassword')
			const savedMqttUser = localStorage.getItem('savedMqttUser')
			const savedMqttPass = localStorage.getItem('savedMqttPass')
			const savedAuthToken = localStorage.getItem('servoAuthToken')

			if (savedUsername) document.getElementById('username').value = savedUsername
			if (savedPassword) document.getElementById('password').value = savedPassword
			if (savedMqttUser) document.getElementById('mqttUser').value = savedMqttUser
			if (savedMqttPass) document.getElementById('mqttPass').value = savedMqttPass

			// const savedMqttUser = localStorage.getItem('mqttUser')
			// const savedMqttPass = localStorage.getItem('mqttPass')
			if (savedMqttUser && savedMqttPass) {
				connectMQTT(savedMqttUser, savedMqttPass)
				if (authToken) {
					document.getElementById('loginScreen').style.display = 'none'
					document.getElementById('mainContent').style.display = 'block'

					// FIX: Force map2 redraw AFTER main content is visible
					setTimeout(() => {
						if (map2) {
							map2.invalidateSize()
						}
					}, 100)
				}
			}
		};
	</script>
