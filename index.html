<!DOCTYPE HTML>
<html>

<head>
	<title>Польовик – Керування сервоприводом</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			font-family: Arial, sans-serif;
			background: #000;
			color: #eee;
			overflow: hidden;
		}

		#warningBanner {
			background: #ff4444;
			color: white;
			padding: 12px;
			text-align: center;
			font-weight: bold;
			position: fixed;
			top: 0;
			width: 100%;
			z-index: 2000;
		}

		#loginScreen {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.9);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		#mainContent {
			display: none;
			padding: 60px 20px 20px;
			max-width: 600px;
			margin: 0 auto;
		}

		h3 {
			margin: 10px 0;
			text-align: center;
		}

		.buttonContainer {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 12px;
			margin: 20px 0;
		}

		.motorSelectContainer {
			display: flex;
			gap: 12px;
		}

		.motorControlContainer {
			display: flex;
			gap: 12px;
		}

		button {
			padding: 12px 24px;
			font-size: 14px;
			background: #4247b7;
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			min-width: 60px;
			position: relative;
			overflow: hidden;
			text-align: center;
		}

		#motor1Btn,
		#motor2Btn {
			transition: all 0.25s ease;
		}

		#motor1Btn.active,
		#motor2Btn.active {
			border: 1px solid #ffff00 !important;
			box-shadow: 0 0 15px #ffff00;
			background: #5a5fff;
		}

		button:hover {
			background: #ff494d;
		}

		button:active {
			background: #d32f2f;
		}

		#syncBtn {
			background: #0288d1;
			width: 170px !important;
			min-width: 170px !important;
			max-width: 170px !important;
			text-align: center;
			box-sizing: border-box;
			padding: 12px 20px;
			flex-shrink: 0;
		}

		#syncBtn.on {
			background: #4caf50;
		}

		#slider-container {
			margin: 2px 0;
			text-align: center;
		}

		#position-slider {
			width: 65%;
			height: 14px;
			background: linear-gradient(to right, #444 0%, #444 30%, #4247b7 30%, #4247b7 70%, #444 70%, #444 100%);
			border-radius: 10px;
			appearance: none;
			outline: none;
		}

		#position-slider::-webkit-slider-thumb {
			width: 44px;
			height: 44px;
			background: #ff494d;
			border-radius: 50%;
			border: 4px solid white;
			cursor: pointer;
		}

		.motorAzimuthContainer {
			display: flex;
			justify-content: space-around;
			gap: 40px;
			margin-top: 2px;
		}

		.motor-pos {
			font-size: 20px;
			margin: 8px 0;
			text-align: center;
		}

		.STSInfoContainer {
			display: flex;
			flex-direction: row;
			justify-content: space-around;
		}

		.STSValue {
			max-width: 40%;
			height: 70px;
			font-size: 14px;
			text-align: center;
			margin: 10px 0;
			padding: 10px;
			background: #111;
			border-radius: 8px;
		}

		#map {
			height: 320px;
			border: 2px solid #4247b7;
			border-radius: 10px;
			margin-top: 25px;
		}

		.azimuth-group {
			display: flex;
			flex-direction: row;
			align-items: center;
			gap: 6px;
			justify-content: center;
		}

		.azimuth-input {
			max-width: 60%;
			width: 230px;
			padding: 12px;
			font-size: 18px;
			border-radius: 8px;
			border: 1px solid #555;
			background: #222;
			color: white;
			-moz-appearance: textfield;
			transition: all 0.25s ease;
		}

		.azimuth-input.active {
			border: 2px solid #ffff00 !important;
			box-shadow: 0 0 15px #ffff00;
		}

		.azimuth-input::-webkit-outer-spin-button,
		.azimuth-input::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		input[type="text"],
		input[type="password"] {
			width: 300px;
			padding: 14px;
			margin: 12px;
			font-size: 17px;
			border-radius: 8px;
			border: 1px solid #555;
			background: #222;
			color: white;
		}

		#loginBtn {
			padding: 16px 50px;
			font-size: 20px;
			background: #28a745;
			border: none;
			border-radius: 8px;
			color: white;
			cursor: pointer;
		}

		#loginBtn:hover {
			background: #218838;
		}

		#loginError {
			color: #ff4444;
			margin-top: 15px;
			min-height: 24px;
			font-size: 16px;
		}

		#logoutBtn {
			position: absolute;
			top: 70px;
			right: 20px;
			padding: 10px 20px;
			background: #d32f2f;
			font-size: 16px;
		}

		/* Стиль для перемикача корекції */
		.correction-toggle {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			font-size: 12px;
			margin: 10px 0;
		}
	</style>
</head>

<body>

	<div id="warningBanner">⚠️ Знаходиться в розробці.</div>

	<div id="loginScreen">
		<h2>Польовик – Авторизація</h2>
		<input type="text" id="username" placeholder="Ім'я користувача пристрою" autocomplete="off">
		<input type="password" id="password" placeholder="Пароль пристрою" autocomplete="off">
		<input type="text" id="mqttUser" placeholder="MQTT Username (наприклад web-guest)" autocomplete="off">
		<input type="password" id="mqttPass" placeholder="MQTT Password" autocomplete="off">
		<button id="loginBtn" onclick="tryLogin()">Увійти</button>
		<div id="loginError"></div>
	</div>

	<div id="mainContent">
		<h3>Польовик</h3>
		<div class="STSInfoContainer">
			<div class="STSValue" id="STSValue-motor1">Лівий: Очікування даних сервоприводу...</div>
			<div class="STSValue" id="STSValue-motor2">Правий: Очікування даних сервоприводу...</div>
		</div>
		<div class="buttonContainer">
			<div class="motorSelectContainer">
				<button id="motor1Btn" onclick="switchMotor(0)">Ліва</button>
				<button id="motor2Btn" onclick="switchMotor(1)">Права</button>
				<button id="syncBtn" onclick="toggleSync()">Sync OFF</button>
			</div>
			<div class="motorControlContainer">
				<button id="setMiddleBtn" onclick="setNewMiddle()">Set New 0°</button>
				<button onclick="sendCommand(3, activeMotor)">Release</button>
				<button onclick="sendCommand(4, activeMotor)">Torque</button>
				<button onclick="goToZero()">0°</button>
				<button onclick="sendCommand(7, activeMotor)">+</button>
				<button onclick="sendCommand(8, activeMotor)">-</button>
			</div>
		</div>

		<div id="slider-container">
			<input type="range" id="position-slider" min="0" max="4095" value="2047" step="any">
		</div>

		<!-- Перемикач корекції -->
		<div class="correction-toggle">
			<input type="checkbox" id="correctionToggle" checked>
			<label for="correctionToggle">Корекція похибки ±7° (реальний азимут)</label>
		</div>

		<div class="motorAzimuthContainer">
			<p class="motor-pos" id="current-pos-motor1">Лівий: 0°</p>
			<p class="motor-pos" id="current-pos-motor2">Правий: 0°</p>
		</div>

		<div
			style="margin:2px 0; text-align:center; display:flex; flex-direction:row; justify-content: space-around; align-items:center; flex-wrap: wrap; gap:20px;">
			<div class="azimuth-group">
				<label for="degreeInput1" style="font-size:18px;"></label>
				<input type="number" id="degreeInput1" min="-77" max="77" step="0.1" placeholder="градуси" class="azimuth-input"
					data-motor="0" oninput="validateAzimuth(this)">

			</div>

			<div class="azimuth-group">
				<label for="degreeInput2" style="font-size:18px;"></label>
				<input type="number" id="degreeInput2" min="-77" max="77" step="0.1" placeholder="градуси" class="azimuth-input"
					data-motor="1" oninput="validateAzimuth(this)">
			</div>
		</div>

		<div id="map"></div>

		<button id="logoutBtn" onclick="logout()">Вийти</button>
	</div>

	<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script>
		const MQTT_BROKER = 'wss://940d7f06dbf1455c841afb26f9c5cf1c.s1.eu.hivemq.cloud:8884/mqtt'
		const CLIENT_ID = 'web-client-' + Math.random().toString(16).substr(2, 8)

		let authToken = localStorage.getItem('servoAuthToken') || ''
		let mqttConnected = false
		let mqttClient = null

		let degMotor1 = 0
		let degMotor2 = 0
		let activeMotor = 0
		let pendingSwitch = false

		let syncEnabled = false
		let pendingSync = false
		let lastSingleActiveMotor = 0

		let map, marker, arrowRed, arrowBlue, outlineYellow1, outlineYellow2

		const CORRECTION = 7
		let useCorrection = true  // стан перемикача

		function validateAzimuth(input) {
			let val = input.value.trim()

			// Дозволяємо тимчасово вводити мінус і крапку
			if (val === '' || val === '-' || val === '-.' || val === '.') return

			let num = parseFloat(val)
			if (isNaN(num)) {
				input.value = ''
				return
			}

			// Обмежуємо ±77
			if (num > 77) input.value = 77
			if (num < -77) input.value = -77
		}

		function connectMQTT(mqttUser, mqttPass) {
			mqttClient = mqtt.connect(MQTT_BROKER, {
				clientId: CLIENT_ID,
				username: mqttUser,
				password: mqttPass,
				clean: true,
				reconnectPeriod: 5000
			})

			mqttClient.on('connect', () => {
				mqttConnected = true
				console.log('MQTT connected')
				document.getElementById('loginError').textContent = 'Підключено до сервера'

				mqttClient.subscribe('Werden/auth/response/' + CLIENT_ID)
				mqttClient.subscribe('Werden/status')
			})

			mqttClient.on('message', (topic, message) => {
				const payload = message.toString()
				console.log('MQTT:', topic, payload)

				if (topic === 'Werden/auth/response/' + CLIENT_ID) {
					try {
						const data = JSON.parse(payload)
						if (data.status === 'success') {
							authToken = data.token
							localStorage.setItem('servoAuthToken', authToken)

							localStorage.setItem('savedUsername', document.getElementById('username').value.trim())
							localStorage.setItem('savedPassword', document.getElementById('password').value.trim())
							localStorage.setItem('savedMqttUser', document.getElementById('mqttUser').value.trim())
							localStorage.setItem('savedMqttPass', document.getElementById('mqttPass').value.trim())

							document.getElementById('loginScreen').style.display = 'none'
							document.getElementById('mainContent').style.display = 'block'
							document.getElementById('loginError').textContent = ''

							setTimeout(() => {
								if (map) map.invalidateSize()
							}, 100)
						} else {
							document.getElementById('loginError').textContent = data.reason || 'Помилка авторизації'
						}
					} catch (e) {
						document.getElementById('loginError').textContent = 'Неправильна відповідь сервера'
					}
				}

				if (topic === 'Werden/status') {
					try {
						const data = JSON.parse(payload)

						document.getElementById("position-slider").value = data.raw

						// Корекція тільки якщо перемикач увімкнено
						let displayDeg = data.deg
						if (useCorrection) {
							if (displayDeg < -1) displayDeg += CORRECTION
							else if (displayDeg > 1) displayDeg -= CORRECTION
						}

						if (data.id == 1) {
							document.getElementById("STSValue-motor1").innerHTML =
								`Лівий | ID: ${data.id} | Raw: ${data.raw} | ${displayDeg.toFixed(1)}° | Нап: ${data.volt || '?'}V | Нав: ${data.load || '?'}% | Швид: ${data.speed || '?'} | Темп: ${data.temp || '?'}°C | Вст.швид: ${data.set_speed || '?'}`
							document.getElementById("current-pos-motor1").textContent = `Лівий: ${displayDeg.toFixed(1)}°`
							degMotor1 = displayDeg
						} else if (data.id == 2) {
							document.getElementById("STSValue-motor2").innerHTML =
								`Правий | ID: ${data.id} | Raw: ${data.raw} | ${displayDeg.toFixed(1)}° | Нап: ${data.volt || '?'}V | Нав: ${data.load || '?'}% | Швид: ${data.speed || '?'} | Темп: ${data.temp || '?'}°C | Вст.швид: ${data.set_speed || '?'}`
							document.getElementById("current-pos-motor2").textContent = `Правий: ${displayDeg.toFixed(1)}°`
							degMotor2 = displayDeg
						}

						if (data.sync !== undefined && !pendingSync) {
							const newSync = data.sync === true
							if (newSync !== syncEnabled) {
								syncEnabled = newSync
								const btn = document.getElementById('syncBtn')
								btn.textContent = syncEnabled ? "Sync ON" : "Sync OFF"
								btn.style.background = syncEnabled ? "#4caf50" : "#0288d1"
								highlightActiveMotor()
								updateActiveInput()
							}
						}

						updateMapDirection()

					} catch (e) {
						console.error('Status parse error:', e)
					}
				}
			})

			mqttClient.on('error', (err) => {
				console.error('MQTT error:', err)
				document.getElementById('loginError').textContent = 'Помилка підключення до MQTT сервера'
			})
		}

		function tryLogin() {
			const user = document.getElementById('username').value.trim()
			const pass = document.getElementById('password').value.trim()
			const mqttUser = document.getElementById('mqttUser').value.trim()
			const mqttPass = document.getElementById('mqttPass').value.trim()
			const errorEl = document.getElementById('loginError')

			if (!user || !pass) { errorEl.textContent = 'Введіть дані пристрою'; return }
			if (!mqttUser || !mqttPass) { errorEl.textContent = 'Введіть MQTT username та password'; return }

			errorEl.textContent = 'Підключення до сервера...'

			connectMQTT(mqttUser, mqttPass)

			setTimeout(() => {
				if (mqttConnected) {
					errorEl.textContent = 'Авторизація пристрою...'
					const payload = JSON.stringify({
						username: user,
						password: pass,
						clientId: CLIENT_ID
					})
					mqttClient.publish('Werden/auth/request', payload)
				}
			}, 2000)
		}

		function sendCommand(cmdT, cmdA = 0, cmdB = 0) {
			if (!authToken || !mqttConnected) {
				alert('Спочатку авторизуйтесь та підключіться')
				return
			}
			const cmdI = (cmdT === 99 || cmdT === 10) ? 0 : activeMotor
			const payload = JSON.stringify({ token: authToken, cmdT, cmdI, cmdA, cmdB })
			mqttClient.publish('Werden/command', payload)
		}

		function switchMotor(index) {
			pendingSwitch = true
			activeMotor = index
			lastSingleActiveMotor = index
			sendCommand(10, index)
			highlightActiveMotor()
			updateActiveInput()
			updateMapDirection()
			setTimeout(() => { pendingSwitch = false }, 1200)
		}

		function highlightActiveMotor() {
			const btn1 = document.getElementById('motor1Btn')
			const btn2 = document.getElementById('motor2Btn')
			if (syncEnabled) {
				btn1.classList.remove('active')
				btn2.classList.remove('active')
			} else {
				btn1.classList.toggle('active', activeMotor === 0)
				btn2.classList.toggle('active', activeMotor === 1)
			}
		}

		function updateActiveInput() {
			const input1 = document.getElementById('degreeInput1')
			const input2 = document.getElementById('degreeInput2')

			if (syncEnabled) {
				input1.classList.add('active')
				input2.classList.add('active')
			} else {
				input1.classList.toggle('active', activeMotor === 0)
				input2.classList.toggle('active', activeMotor === 1)
			}
		}

		function toggleSync() {
			pendingSync = true

			if (!syncEnabled) {
				lastSingleActiveMotor = activeMotor
			}

			syncEnabled = !syncEnabled

			if (!syncEnabled) {
				activeMotor = lastSingleActiveMotor
			}

			const btn = document.getElementById('syncBtn')
			btn.textContent = syncEnabled ? "Sync ON" : "Sync OFF"
			btn.style.background = syncEnabled ? "#4caf50" : "#0288d1"
			sendCommand(99, syncEnabled ? 1 : 0)
			highlightActiveMotor()
			updateActiveInput()
			updateMapDirection()

			setTimeout(() => { pendingSync = false }, 1200)
		}

		function startMove(cmdT) {
			const currentDeg = activeMotor === 0 ? degMotor1 : degMotor2

			if (cmdT === 5 && currentDeg >= 77) return
			if (cmdT === 6 && currentDeg <= -77) return

			sendCommand(cmdT, 0)
		}

		function stopMove() {
			sendCommand(2, 0)
		}

		function sendDegreeFromInput(inputEl) {
			let deg = parseFloat(inputEl.value)
			if (isNaN(deg)) return

			// Обмежуємо ±77
			deg = Math.max(-77, Math.min(77, deg))

			const correctedDeg = deg + CORRECTION
			const raw = Math.round(2047 + (correctedDeg * 4095 / 360))

			const motorIndex = parseInt(inputEl.dataset.motor)
			if (motorIndex === 0) degMotor1 = deg
			else degMotor2 = deg

			updateMapDirection()
			sendCommand(22, raw)

			inputEl.value = ''
		}

		document.getElementById('degreeInput1').addEventListener('keypress', e => { if (e.key === 'Enter') sendDegreeFromInput(e.target) })
		document.getElementById('degreeInput2').addEventListener('keypress', e => { if (e.key === 'Enter') sendDegreeFromInput(e.target) })

		function setNewMiddle() {
			sendCommand(11, 0)

			degMotor1 = 0
			degMotor2 = 0

			document.getElementById("current-pos-motor1").textContent = `Лівий: 0°`
			document.getElementById("current-pos-motor2").textContent = `Правий: 0°`

			document.getElementById("position-slider").value = 2047

			updateMapDirection()

			const btn = document.getElementById('setMiddleBtn')
			const originalBg = btn.style.background
			btn.style.background = '#4caf50'
			setTimeout(() => { btn.style.background = originalBg }, 500)
		}

		// НОВА ФУНКЦІЯ: розумна кнопка 0° з корекцією
		function goToZero() {
			const currentDeg = activeMotor === 0 ? degMotor1 : degMotor2
			let targetDeg = 0

			// Враховуємо поточний напрямок зміщення
			if (currentDeg < -1) {
				targetDeg = -CORRECTION // якщо зліва — ціль трохи лівіше
			} else if (currentDeg > 1) {
				targetDeg = CORRECTION  // якщо справа — ціль трохи правіше
			}

			const raw = Math.round(2047 + (targetDeg * 4095 / 360))
			sendCommand(22, raw)

			// Оптимістично обнуляємо відображення
			if (activeMotor === 0) degMotor1 = 0
			else degMotor2 = 0

			document.getElementById("current-pos-motor1").textContent = `Лівий: 0°`
			document.getElementById("current-pos-motor2").textContent = `Правий: 0°`
			updateMapDirection()
		}

		document.getElementById('position-slider').addEventListener('input', function () {
			let newPos = parseInt(this.value)
			let deg = Math.round((newPos - 2047) * 360 / 4095)
			deg = Math.max(-77, Math.min(77, deg))

			const correctedDeg = deg + CORRECTION
			newPos = Math.round(2047 + (correctedDeg * 4095 / 360))

			this.value = newPos
			degMotor1 = deg
			degMotor2 = deg
			document.getElementById("current-pos-motor1").textContent = `Лівий: ${deg.toFixed(1)}°`
			document.getElementById("current-pos-motor2").textContent = `Правий: ${deg.toFixed(1)}°`
			updateMapDirection()
			sendCommand(22, newPos)
		})

		// function goToZero() {
		// 	const currentDeg = activeMotor === 0 ? degMotor1 : degMotor2
		// 	let targetDeg = 0
		// 	if (currentDeg > 1) targetDeg = -7
		// 	else if (currentDeg < -1) targetDeg = 7

		// 	const raw = Math.round(2047 + (targetDeg * 4095 / 360))
		// 	sendCommand(22, raw)

		// 	if (activeMotor === 0) degMotor1 = 0
		// 	else degMotor2 = 0

		// 	document.getElementById("current-pos-motor1").textContent = `Лівий: 0°`
		// 	document.getElementById("current-pos-motor2").textContent = `Правий: 0°`
		// 	updateMapDirection()
		// }

		document.getElementById('correctionToggle').addEventListener('change', function () {
			useCorrection = this.checked
			// Примусово оновити відображення (без запиту статусу)
			updateMapDirection()
		})

		function logout() {
			localStorage.removeItem('servoAuthToken')
			localStorage.removeItem('savedUsername')
			localStorage.removeItem('savedPassword')
			localStorage.removeItem('savedMqttUser')
			localStorage.removeItem('savedMqttPass')
			location.reload()
		}

		function initMap() {
			map = L.map('map').setView([48.904339, 37.605560], 10)
			L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
				attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)',
				maxZoom: 17
			}).addTo(map)

			marker = L.marker([48.904339, 37.605560]).addTo(map)
				.bindPopup('Польовик').openPopup()

			outlineYellow1 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map)
			outlineYellow2 = L.polyline([], { color: '#ffff00', weight: 14, opacity: 0.5 }).addTo(map)

			arrowRed = L.polyline([], { color: 'red', weight: 8, opacity: 0.95 }).addTo(map)
			arrowBlue = L.polyline([], { color: '#00aaff', weight: 6, opacity: 0.75, dashArray: '8, 8' }).addTo(map)

			updateMapDirection()
		}

		function updateMapDirection() {
			if (!map || !marker) return
			const center = marker.getLatLng()
			const distance = 0.18

			const createLine = (deg) => {
				if (isNaN(deg)) return []
				const rad = deg * Math.PI / 180
				const dLat = distance * Math.cos(rad)
				const dLng = distance * Math.sin(rad) / Math.cos(center.lat * Math.PI / 180)
				return [[center.lat, center.lng], [center.lat + dLat, center.lng + dLng]]
			}

			const line1 = createLine(degMotor1)
			const line2 = createLine(degMotor2)

			arrowRed.setLatLngs(line1)
			arrowBlue.setLatLngs(line2)

			if (syncEnabled) {
				outlineYellow1.setLatLngs([])
				outlineYellow2.setLatLngs([])
			} else {
				outlineYellow1.setLatLngs(activeMotor === 0 ? line1 : [])
				outlineYellow2.setLatLngs(activeMotor === 1 ? line2 : [])
			}
		}

		window.onload = function () {
			document.getElementById("position-slider").value = 2047

			initMap()
			highlightActiveMotor()
			updateActiveInput()

			setTimeout(() => {
				if (map) map.invalidateSize()
			}, 300)

			const savedUsername = localStorage.getItem('savedUsername')
			const savedPassword = localStorage.getItem('savedPassword')
			const savedMqttUser = localStorage.getItem('savedMqttUser')
			const savedMqttPass = localStorage.getItem('savedMqttPass')
			const savedAuthToken = localStorage.getItem('servoAuthToken')

			if (savedUsername) document.getElementById('username').value = savedUsername
			if (savedPassword) document.getElementById('password').value = savedPassword
			if (savedMqttUser) document.getElementById('mqttUser').value = savedMqttUser
			if (savedMqttPass) document.getElementById('mqttPass').value = savedMqttPass

			if (savedMqttUser && savedMqttPass) {
				connectMQTT(savedMqttUser, savedMqttPass)
				if (savedAuthToken) {
					authToken = savedAuthToken
					document.getElementById('loginScreen').style.display = 'none'
					document.getElementById('mainContent').style.display = 'block'

					setTimeout(() => {
						if (map) map.invalidateSize()
					}, 100)
				}
			}
		};
	</script>
